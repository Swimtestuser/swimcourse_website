<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwimCourse</title><style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:24px;color:#172338;background:#f8fafc}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{color:#155eab} nav{display:flex;gap:14px;align-items:center} main{margin-top:30px}
.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
button,.button{background:#1456a0;color:white;padding:9px 14px;border:0;border-radius:8px;cursor:pointer}
input,select{padding:9px;border:1px solid #cbd5e1;border-radius:8px} form.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
</style></head><body>
<header><h1>SwimCourse</h1><nav>
{% if user.is_authenticated %}<a href="{% url 'exercise_list' %}">Übungen</a><a href="{% url 'favorites' %}">Favoriten</a>
<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Abmelden</button></form>
{% else %}<a href="{% url 'login' %}">Anmelden</a><a href="{% url 'register' %}">Registrieren</a>{% endif %}
</nav></header><main>{% block content %}{% endblock %}</main></body></html>
