{% extends "base.html" %}{% block content %}<h2>Meine Favoriten</h2><div class="grid">
{% for exercise in exercises %}<article class="card"><h3>{{ exercise.title }}</h3><p>{{ exercise.swim_style }}</p>
<form method="post" action="{% url 'toggle_favorite' exercise.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'favorites' %}"><button>★ Entfernen</button></form>
</article>{% empty %}<p>Du hast noch keine Favoriten.</p>{% endfor %}</div>{% endblock %}
